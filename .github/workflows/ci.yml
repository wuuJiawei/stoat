name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - run: gofmt -l . | tee /tmp/unformatted && test ! -s /tmp/unformatted
      - run: go vet ./...
      - run: go test -race ./...
      - run: shellcheck -x scripts/*.sh
      - run: bash scripts/install_test.sh
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./cmd/stoat
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./cmd/stoat

  macos-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...
      - run: ruby -c Formula/stoat.rb
      - run: brew style Formula/stoat.rb
      - run: bash scripts/install_test.sh
      - run: go build -trimpath -o stoat ./cmd/stoat
      - run: ./stoat scan --json > report.json
      - run: jq -e '.schema_version == 1 and (.items | type == "array")' report.json
      - name: Diagnose one discovered item
        run: |
          item_id="$(jq -r '.items[0].id // empty' report.json)"
          if [[ -n "$item_id" ]]; then
            ./stoat diagnose "$item_id" --json --last 1m --limit 5 > diagnostic.json
            jq -e '.schema_version == 1 and .item_id != ""' diagnostic.json
          fi

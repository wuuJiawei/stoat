name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Verify
        run: |
          test "$(git tag --points-at HEAD)" = "$GITHUB_REF_NAME"
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test -race ./...
          ruby -c Formula/stoat.rb
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/stage
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/stage/stoat" ./cmd/stoat
            cp README.md LICENSE "dist/stage/"
            tar -C dist/stage -czf "dist/stoat-${VERSION}-darwin-${arch}.tar.gz" stoat README.md LICENSE
            rm -f dist/stage/stoat
          done
          rm -rf dist/stage
          cd dist
          shasum -a 256 stoat-*.tar.gz > checksums.txt
      - name: Sign archives with Sigstore
        run: |
          for archive in dist/stoat-*.tar.gz; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/stoat-*.tar.gz dist/stoat-*.sigstore.json dist/checksums.txt --verify-tag --generate-notes

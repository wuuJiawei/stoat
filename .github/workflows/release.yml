name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create version tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Verify
        run: |
          test "$(git tag --points-at HEAD)" = "$GITHUB_REF_NAME"
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test -race ./...
          bash -n scripts/*.sh
          bash scripts/install_test.sh
          ruby -c Formula/stoat.rb
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/stage
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/stage/stoat" ./cmd/stoat
            cp README.md LICENSE "dist/stage/"
            tar -C dist/stage -czf "dist/stoat-${VERSION}-darwin-${arch}.tar.gz" stoat README.md LICENSE
            rm -f dist/stage/stoat
          done
          rm -rf dist/stage
          cd dist
          shasum -a 256 stoat-*.tar.gz > checksums.txt
          printf '%s\n' "$VERSION" > latest.txt
          cp ../scripts/install.sh ../scripts/install-cn.sh .
      - name: Sign archives with Sigstore
        run: |
          for archive in dist/stoat-*.tar.gz; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/stoat-*.tar.gz dist/stoat-*.sigstore.json dist/checksums.txt dist/latest.txt dist/install.sh dist/install-cn.sh --verify-tag --generate-notes

          if git rev-parse "$version" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$version")" = "$GITHUB_SHA"
            exit 0
          fi
          git tag -a "$version" -m "Stoat $version"
          git push origin "$version"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Verify
        run: |
          test "$(git tag --points-at HEAD)" = "$GITHUB_REF_NAME"
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test -race ./...
          bash -n scripts/*.sh
          bash scripts/install_test.sh
          ruby -c Formula/stoat.rb
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/stage
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/stage/stoat" ./cmd/stoat
            cp README.md LICENSE "dist/stage/"
            tar -C dist/stage -czf "dist/stoat-${VERSION}-darwin-${arch}.tar.gz" stoat README.md LICENSE
            rm -f dist/stage/stoat
          done
          rm -rf dist/stage
          cd dist
          shasum -a 256 stoat-*.tar.gz > checksums.txt
          printf '%s\n' "$VERSION" > latest.txt
          cp ../scripts/install.sh ../scripts/install-cn.sh .
      - name: Sign archives with Sigstore
        run: |
          for archive in dist/stoat-*.tar.gz; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/stoat-*.tar.gz dist/stoat-*.sigstore.json dist/checksums.txt dist/latest.txt dist/install.sh dist/install-cn.sh --verify-tag --generate-notes

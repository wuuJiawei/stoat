name: Release

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['VERSION', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare immutable version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version=$(tr -d '[:space:]' < VERSION)
          fi
          printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$version" -m "Stoat $version"
            git push origin "$version"
          fi
          git checkout --detach "$version"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.prepare.outputs.publish == 'true'
        with:
          go-version: '1.25.x'
          cache: true
      - uses: sigstore/cosign-installer@v4.1.2
        if: steps.prepare.outputs.publish == 'true'
      - name: Verify
        if: steps.prepare.outputs.publish == 'true'
        run: |
          test "$(git tag --points-at HEAD)" = "${{ steps.prepare.outputs.version }}"
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test -race ./...
          bash -n scripts/*.sh
          bash scripts/install_test.sh
          ruby -c Formula/stoat.rb
      - name: Build archives
        if: steps.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          mkdir -p dist/stage
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/stage/stoat" ./cmd/stoat
            cp README.md LICENSE "dist/stage/"
            tar -C dist/stage -czf "dist/stoat-${VERSION}-darwin-${arch}.tar.gz" stoat README.md LICENSE
            rm -f dist/stage/stoat
          done
          rm -rf dist/stage
          cd dist
          shasum -a 256 stoat-*.tar.gz > checksums.txt
          printf '%s\n' "$VERSION" > latest.txt
          cp ../scripts/install.sh ../scripts/install-cn.sh .
      - name: Sign archives with Sigstore
        if: steps.prepare.outputs.publish == 'true'
        run: |
          for archive in dist/stoat-*.tar.gz; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done
      - name: Publish GitHub release
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.prepare.outputs.version }}" dist/stoat-*.tar.gz dist/stoat-*.sigstore.json dist/checksums.txt dist/latest.txt dist/install.sh dist/install-cn.sh --verify-tag --generate-notes

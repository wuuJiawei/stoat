    <text x="626" y="132" fill="#8ccfff" font-size="20" font-weight="700">https://github.com/wuuJiawei/stoat</text>
    <text x="626" y="174" fill="#9fe870" font-size="20">Inspect and manage what runs on your Mac.</text>
    <text x="626" y="216" fill="#777777" font-size="20">Version v1.2.0</text>

    <text x="58" y="332" fill="#e8e8e8" font-weight="700">Choose what you want to inspect</text>

    <text x="58" y="390" fill="#f2d675" font-weight="700">› 1  Startup Items</text>
    <text x="96" y="422" fill="#777777" font-size="20">Runs at login or system startup</text>

